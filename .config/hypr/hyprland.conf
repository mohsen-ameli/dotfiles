############################################
#### Environment Variables
############################################
env = fileManager,dolphin
env = qt_qpa_platformtheme,qt6ct
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GDK_SCALE,1
env = GDK_BACKEND,wayland,x11,*
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

############################################
#### Exec Once
############################################
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $HOME/.local/bin/wallpaper --random
# exec-once = python3 $HOME/.local/share/wallpaperengine-linux/main.py --apply 
exec-once = $HOME/.local/bin/hypr-mode --normal
exec-once = $HOME/.local/bin/xdg-portal-hyprland
exec-once = $HOME/.local/bin/apply-settings
exec-once = $HOME/.local/bin/battery-alert
exec-once = $HOME/.local/bin/battery-graph-live
exec-once = $HOME/.local/bin/run-bar
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = asusctl profile --profile-set Quiet
exec-once = asusctl --chg-limit $CHARGE_LIMIT
exec-once = hypridle
exec-once = dunst
exec-once = swww-daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = cliphist wipe
exec-once = koi

############################################
#### Sourcing Files
#### Hyprland colors and key bindings
############################################
source = $HOME/.cache/wal/colors-hyprland.conf
source = ./conf/binds.conf

############################################
#### Window Rules
############################################
windowrule {
  name = windowrule-1
  opacity = 1
  suppress_event = maximize
  match:class = .*
}

windowrule {
  name = windowrule-2
  float = on
  center = on
  match:class = Loupe
}

windowrule {
  name = windowrule-3
  float = on
  center = on
  size = 1000 680
  match:class = gedit
}

windowrule {
  name = windowrule-4
  opacity = 0.97
  match:class = vesktop
}

windowrule {
  name = windowrule-5
  idle_inhibit = fullscreen
  match:class = firefox
}

windowrule {
  name = windowrule-6
  idle_inhibit = fullscreen
  match:class = vlc
}

windowrule {
  name = windowrule-7
  float = on
  center = on
  size = 1000 685
  match:class = floating
}

windowrule {
  name = windowrule-8
  float = on
  center = on
  match:class = main.py
}

windowrule {
  name = windowrule-9
  float = on
  center = on
  match:class = python3
}

windowrule {
  name = windowrule-10
  float = on
  center = on
  match:class = mpv
}

windowrule {
  name = windowrule-11
  float = on
  center = on
  match:class = xdg-desktop-portal-gtk
}


############################################
#### Monitor
############################################
# Monitor = Name, Resolution@fps, idk, scale
monitor = eDP-1, 1920x1080@144, 0x0, 1.25
monitor = HDMI-A-1, 3840x2160@60, 1920x0, 1
# monitor = , preferred, auto, 1
# monitor = , preferred, auto, 1

############################################
#### Misc Settings
############################################
render {
}


input {
    kb_layout = us,ir
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        scroll_factor = 0.1
    }
    sensitivity = 0.1 # -1.0 to 1.0, 0 means no modification.
    repeat_delay = 300
    repeat_rate = 50
}

cursor {
    no_hardware_cursors = true
}

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = $color4
    col.inactive_border = $background
    resize_on_border = true
    layout = dwindle
    allow_tearing = true
}

decoration {
    rounding = 10
    blur {
        enabled = false
    }
}

